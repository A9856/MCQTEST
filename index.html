<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #4338ca;
            --success: #16a34a;
            --danger: #dc2626;
            --text: #1f2937;
            --border: #dbeafe;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;

            background: linear-gradient(135deg,
                    #dbeafe,
                    #ede9fe,
                    #fce7f3);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
            user-select:none;
            -webkit-user-select:none;
            -moz-user-select:none;
            -ms-user-select:none;
        }

        .container {
            width: 95%;
            max-width: 1200px;

            background: rgba(255, 255, 255, .95);

            backdrop-filter: blur(10px);

            border-radius: 20px;

            padding: 30px;

            box-shadow:
                0 10px 30px rgba(79, 70, 229, .15),
                0 5px 15px rgba(0, 0, 0, .08);
        }

        .question h2 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .question p {
            font-size: 1.3rem;
            color: var(--text);
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        label {
            flex: 1 1 45%;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 16px;

            border: 2px solid #dbeafe;

            border-radius: 12px;

            background: linear-gradient(135deg,
                    #ffffff,
                    #f8fafc);

            cursor: pointer;

            transition: all .3s ease;

            font-size: 1rem;
            font-weight: 500;

            color: var(--text);
        }

        label:hover {
            border-color: #6366f1;

            background: linear-gradient(135deg,
                    #eef2ff,
                    #f5f3ff);

            transform: translateY(-3px);

            box-shadow: 0 6px 15px rgba(99, 102, 241, .15);
        }

        input[type="radio"] {
            transform: scale(1.2);
            accent-color: #4f46e5;
        }

        label:has(input[type="radio"]:checked) {

            border: 2px solid #4f46e5;

            background: linear-gradient(135deg,
                    #e0e7ff,
                    #eef2ff);

            box-shadow: 0 4px 12px rgba(79, 70, 229, .2);
        }

        .navigation {
            margin-top: 30px;

            display: flex;
            justify-content: space-between;
        }

        button {
            min-width: 120px;

            padding: 12px 20px;

            border: none;
            border-radius: 10px;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            transition: .3s;

            color: white;
        }

        #prevBtn {
            background: #6b7280;
        }

        #prevBtn:hover {
            background: #4b5563;
        }

        #nextBtn {
            background: linear-gradient(135deg,
                    #4f46e5,
                    #6366f1);
        }

        #nextBtn:hover {
            background: linear-gradient(135deg,
                    #4338ca,
                    #4f46e5);
        }

        #submitBtn {
            background: linear-gradient(135deg,
                    #16a34a,
                    #22c55e);
        }

        #submitBtn:hover {
            background: linear-gradient(135deg,
                    #15803d,
                    #16a34a);
        }

        .hidden {
            display: none;
        }

        .result {
            background: #f8fafc;

            padding: 18px;

            margin-bottom: 15px;

            border-radius: 12px;

            border-left: 6px solid var(--primary);

            color: var(--text);

            font-size: 18px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
        }

        .answer {
            margin-top: 8px;

            font-size: 15px;

            color: #4b5563;
        }

        hr {
            margin: 15px 0;

            border: none;

            border-top: 1px solid #d1d5db;
        }

        /* Popup */

        #popupOverlay {

            position: fixed;

            inset: 0;

            background: linear-gradient(rgba(79, 70, 229, .35),
                    rgba(168, 85, 247, .35));

            backdrop-filter: blur(6px);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        #popupBox {

            width: 420px;

            background: linear-gradient(135deg,
                    #ffffff,
                    #f8fafc);

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            border: 1px solid #e0e7ff;

            box-shadow:
                0 15px 40px rgba(79, 70, 229, .20);
        }

        #popupBox h2 {

            color: #4f46e5;

            margin-bottom: 20px;

            font-size: 28px;
        }

        #popupBox input {

            width: 100%;

            padding: 14px;

            margin: 10px 0;

            border: 2px solid #dbeafe;

            border-radius: 10px;

            font-size: 16px;

            transition: .3s;
        }

        #popupBox input:focus {

            outline: none;

            border-color: #4f46e5;

            box-shadow: 0 0 10px rgba(79, 70, 229, .15);
        }

        #startQuizBtn {

            width: 100%;

            background: linear-gradient(135deg,
                    #4f46e5,
                    #7c3aed);

            color: white;

            border: none;

            padding: 14px;

            border-radius: 10px;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            margin-top: 12px;

            transition: .3s;
        }

        #startQuizBtn:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(79, 70, 229, .25);
        }

        @media(max-width:768px) {

            .container {
                padding: 20px;
            }

            .question h2 {
                font-size: 1.4rem;
            }

            .question p {
                font-size: 1.1rem;
            }

            .options {
                flex-direction: column;
            }

            label {
                flex: 1 1 100%;
            }

            #popupBox {
                width: 95%;
            }
        }
    </style>
</head>

        const totalQuestions = questions.length;
        var cQuestion = 0;
        var answers = Array(totalQuestions).fill(null);

        var quizElement = document.getElementById("quiz");
        var prevBtn = document.getElementById("prevBtn");
        var nextBtn = document.getElementById("nextBtn");
        var submitBtn = document.getElementById("submitBtn");
        let timeLeft = 30;
        let questionTimer;
        function renderQuestion() {
            var questionData = questions[cQuestion];
            quizElement.innerHTML = `
<div class="question">
    <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Question ${cQuestion + 1}</h2>
        <h2 style="color:red"><img src="clock.png"width="45"height="30px"> <span id="timer">30</span>s</h2>
    </div>

    <p>${questionData.question}</p>
</div>

<div class="options">
    ${questionData.options.map((option, index) => `
        <label>
            <input type="radio"
                   name="answer"
                   value="${index}"
                   ${answers[cQuestion] === index ? 'checked' : ''}>
            ${option}
        </label>
    `).join("")}
</div>
`;
            //     quizElement.innerHTML = `
            // <div class="question">
            //     <h2>Question ${cQuestion + 1}:</h2>
            //        <p>${questionData.question}</p>
            // </div>
            // <div class="options"style="display:flex">

            //        <label>
            //          <input type="radio" name="answer" value="${index}" ${answers[cQuestion] === index ? 'checked' : ''}>
            //              ${option}
            //       </label>
            //          `).join('')}
            // </div>
            //     `;
        }
        function startQuestionTimer() {

            clearInterval(questionTimer);

            timeLeft = 30;

            document.getElementById("timer").innerText = timeLeft;

            questionTimer = setInterval(() => {

                timeLeft--;

                document.getElementById("timer").innerText = timeLeft;

                if (timeLeft <= 0) {

                    clearInterval(questionTimer);

                    if (cQuestion < totalQuestions - 1) {

                        cQuestion++;

                        renderQuestion();
                        updateNavigation();
                        // startQuestionTimer();

                    } else {

                        showResult();
                    }
                }

            }, 1000);
        }
        prevBtn.style.display = "none";
        nextBtn.addEventListener("click", () => {

            clearInterval(questionTimer);

            if (cQuestion < totalQuestions - 1) {

                cQuestion++;

                renderQuestion();
                updateNavigation();
                startQuestionTimer();

            }
        });

        function updateNavigation() {

            nextBtn.disabled = cQuestion === totalQuestions - 1;

            submitBtn.classList.toggle(
                "hidden",
                cQuestion !== totalQuestions - 1
            );
        }
        let resultSaved = false;
        let attemptId = Date.now();
        function showResult() {
            if (resultSaved) {
                return;
            }

            resultSaved = true;

            clearInterval(questionTimer);

            let correctAnswers = 0;

            questions.forEach((question, index) => {

                if (answers[index] === question.answer) {
                    correctAnswers++;
                }

            });

            let percentage = ((correctAnswers / totalQuestions) * 100).toFixed(2);

            let grade = "";

            if (percentage >= 90) {
                grade = "S";
            }
            else if (percentage >= 80) {
                grade = "A++";
            }
            else if (percentage >= 70) {
                grade = "A";
            }
            else if (percentage >= 60) {
                grade = "B";
            }
            else if (percentage >= 50) {
                grade = "C";
            }
            else {
                grade = "D";
            }

            if (!resultSaved) {

                resultSaved = true;

                saveResultToFirebase({
                        attemptId: attemptId,

                    studentName: studentName,

                    courseName: courseName,

                    totalQuestions: totalQuestions,

                    correctAnswers: correctAnswers,

                    wrongAnswers: totalQuestions - correctAnswers,

                    percentage: Number(percentage),

                    grade: grade,

                    date: new Date().toLocaleString()

                });

            }

            const resultHTML = `
    
    <div style="
        text-align:center;
        padding:20px;
        background:white;
        border-radius:10px;
        margin-bottom:20px;
        box-shadow:0 0 10px rgba(0,0,0,.2);
    ">

        <h1>Quiz Result</h1>
        <h2>Student Name : ${studentName}</h2>

<h2>Course Name : ${courseName}</h2>

        <h2>Total Questions : ${totalQuestions}</h2>

        <h2>Correct Answers : ${correctAnswers}</h2>

        <h2>Wrong Answers : ${totalQuestions - correctAnswers}</h2>

        <h2>Total Marks : ${correctAnswers}/${totalQuestions}</h2>

        <h2>Percentage : ${percentage}%</h2>

        <h1 style="color:green">
            Grade : ${grade}
        </h1>

    </div>

    ${questions.map((question, index) => {

                const isCorrect =
                    answers[index] === question.answer;

                return `
        <div class="result">

            <h3>
                Question ${index + 1}
                :
                ${isCorrect ? '✅ Correct' : '❌ Incorrect'}
            </h3>

            <div class="answer">
                Your Answer :
                ${answers[index] !== null
                        ? question.options[answers[index]]
                        : "Not Attempted"
                    }
            </div>

            <div class="answer">
                Correct Answer :
                ${question.options[question.answer]}
            </div>

        </div>

        <hr>
        `;
            }).join("")}
    `;

            saveResultToFirebase({

                studentName: studentName,

                courseName: courseName,

                totalQuestions: totalQuestions,

                correctAnswers: correctAnswers,

                wrongAnswers: totalQuestions - correctAnswers,

                percentage: percentage,

                grade: grade,

                date: new Date().toLocaleString()

            });
            quizElement.innerHTML = resultHTML;
           
            nextBtn.style.display = "none";
            submitBtn.style.display = "none";
        }
        function Submit() {
            alert("Time's up! Submitting the quiz.");
            showResult();
        }

        submitBtn.addEventListener("click", () => {
            showResult();
        });
        quizElement.addEventListener("change", (e) => {
            if (e.target.name === "answer") {
                answers[cQuestion] = parseInt(e.target.value);
            }
        });
        setTimeout(Submit, timerDuration);
        document
            .getElementById("startQuizBtn")
            .addEventListener("click", () => {
                document.documentElement.requestFullscreen();

                studentName =
                    document.getElementById("username").value.trim();

                courseName =
                    document.getElementById("course").value.trim();

                if (studentName === "") {
                    alert("Please Enter Username");
                    return;
                }

                document
                    .getElementById("popupOverlay")
                    .style.display = "none";

                document
                    .getElementById("mainQuiz")
                    .style.display = "block";

                renderQuestion();
                updateNavigation();
                startQuestionTimer();

            });
